# Builds the ready-made codespace image and publishes it to GitHub Packages.
# Runs only in the Techolas template repo, never in students' copies.
name: Build codespace image
on:
  workflow_dispatch:
  push:
    paths:
      - requirements.txt
      - .devcontainer/Dockerfile
permissions:
  contents: read
  packages: write
jobs:
  build:
    if: github.repository == 'Techolas-Git/ai-career-planner-starter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          tags: ghcr.io/techolas-git/ai-career-planner-env:latest
